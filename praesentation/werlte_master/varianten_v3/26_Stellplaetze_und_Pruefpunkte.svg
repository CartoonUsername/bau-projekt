<text x="43.000" y="44.000" font-size="2.9" text-anchor="start" font-weight="600" fill="#1B1F24">Bedarf (grobe Annahme der Excel, nicht Satzung)</text>
<text x="143.000" y="44.000" font-size="2.9" text-anchor="start" font-weight="600" fill="#1B1F24">Nachweislich möglich</text>
