<svg xmlns="http://www.w3.org/2000/svg" width="420.0mm" height="297.0mm" viewBox="0 0 420.0 297.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision"><defs></defs><rect width="420.0" height="297.0" fill="#FFFFFF"/><text x="14.000" y="20.000" font-size="6.0" text-anchor="start" font-weight="600" fill="#1B1F24">Stellplätze und baurechtliche Prüfpunkte – Bedarf, Nachweis und offene Fragen getrennt</text>
<text x="14.000" y="27.000" font-size="3.0" text-anchor="start" font-weight="400" fill="#6B7280">Alle Werte hypothetisch oder Annahme; es wird keine Zulässigkeit behauptet. Die 32 × 30 m sind keine bestätigte Grundstücksgröße.</text>
<text x="14.000" y="38.000" font-size="3.6" text-anchor="start" font-weight="600" fill="#1B1F24">1. Stellplätze: Bedarf und Nachweis getrennt</text>
