<text x="221.000" y="81.590" font-size="2.9" text-anchor="start" font-weight="400" fill="#1B1F24">3,0 von 5,0 m Tiefe durch die Auskragung; Durchfahrtshöhe 3,20</text>
<text x="221.000" y="85.360" font-size="2.9" text-anchor="start" font-weight="400" fill="#1B1F24">m (Annahme)</text>
