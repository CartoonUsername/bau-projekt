<text x="14.000" y="94.625" font-size="2.9" text-anchor="start" font-weight="400" fill="#1B1F24">Die Stellplatzsatzung der Stadt ist nicht bekannt; der Bedarf folgt den groben Annahmen der Excel. Mögliche Lösungen (Stellplätze außerhalb des Grundstücks, Ablöse, Gemeinschaftsanlage, Fahrradstellplätze) sind mit</text>
<text x="14.000" y="98.540" font-size="2.9" text-anchor="start" font-weight="400" fill="#1B1F24">der Stadt zu klären und nicht Teil dieser Geometrie. Die Überdachung erzeugt keine zusätzlichen Stellplätze.</text>
