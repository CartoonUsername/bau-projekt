ill="#FFFFFF" opacity="0.85"/><text x="1246" y="542" font-size="19" fill="#1F2421" font-weight="bold">Eingang Wohnen</text><foreignObject x="1246" y="552" width="300" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:#5B6770;line-height:1.25">Treppenhaus mit Aufzug am Westende, ruhig getrennt</div></foreignObject><rect x="1230" y="630" width="330" height="100" rx="10" fill="#FFFFFF" opacity="0.85"/><text x="1246" y="662" font-size="19" fill="#1F2421" font-weight="bold">Stellplätze</text><foreignObject x="1246" y="672" width="300" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="font-size:15px;color:#5B6770;line-height:1.25">ca. 8–10 auf dem Grundstück, Rest über die Parkfläche</div></foreignObject><text x="40" y="968" font-size="14" fill="#1F2421" >Skizze, nicht maßstäblich genau. Grundfläche 540 m², Staffelgeschoss und Gesamthöhe ca. 9,90 m müssen mit der Stadt abgestimmt werden. Stand Oktober 2026.</text></svg>